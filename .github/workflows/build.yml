name: Build

# Every push to main: build + test Windows, macOS, Android (emulator) and iOS (simulator).
# Pushing a tag like v1.0.1 also publishes a Release page with the Windows +
# macOS zips and the Android APK.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PLUGINVAL_VERSION: v1.0.4

jobs:
  windows:
    name: Windows (VST3 + Standalone)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Audio tests (loads the real VST3 like a DAW)
        run: ./build/BitBuddyTestHost_artefacts/Release/BitBuddyTestHost.exe --test build/BitBuddy_artefacts/Release/VST3/BitBuddy.vst3

      - name: pluginval (strictness 10)
        run: |
          Invoke-WebRequest "https://github.com/Tracktion/pluginval/releases/download/$env:PLUGINVAL_VERSION/pluginval_Windows.zip" -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 10 --validate build/BitBuddy_artefacts/Release/VST3/BitBuddy.vst3

      - name: Package
        run: powershell -ExecutionPolicy Bypass -File scripts/make-share-package.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: BitBuddy-Windows
          path: dist/*.zip
          if-no-files-found: error

  macos:
    name: macOS (AU + VST3 + Standalone, universal)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2.26
        with:
          key: macos-universal
          max-size: 2G

      - name: Configure
        run: >
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --parallel

      - name: Install the plugins on the build machine (needed to validate the AU)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components ~/Library/Audio/Plug-Ins/VST3
          cp -R build/BitBuddy_artefacts/Release/AU/BitBuddy.component ~/Library/Audio/Plug-Ins/Components/
          cp -R build/BitBuddy_artefacts/Release/VST3/BitBuddy.vst3 ~/Library/Audio/Plug-Ins/VST3/
          killall -9 AudioComponentRegistrar || true

      - name: auval (Apple's Audio Unit validator)
        run: auval -v aumu Bbd1 Bbdl

      - name: Audio tests - VST3
        run: build/BitBuddyTestHost_artefacts/Release/BitBuddyTestHost --test build/BitBuddy_artefacts/Release/VST3/BitBuddy.vst3

      - name: Audio tests - AU
        run: build/BitBuddyTestHost_artefacts/Release/BitBuddyTestHost --test ~/Library/Audio/Plug-Ins/Components/BitBuddy.component

      - name: pluginval (strictness 10, VST3 + AU)
        run: |
          curl -sSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_macOS.zip"
          unzip -q pluginval.zip
          pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate build/BitBuddy_artefacts/Release/VST3/BitBuddy.vst3
          pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate ~/Library/Audio/Plug-Ins/Components/BitBuddy.component

      - name: Package
        run: bash scripts/make-share-package-mac.sh

      - uses: actions/upload-artifact@v7
        with:
          name: BitBuddy-macOS
          path: dist/*.zip
          if-no-files-found: error

  android:
    name: Android (standalone app)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Linux packages (to build JUCE's Projucer)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build xvfb libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libgl1-mesa-dev libcurl4-openssl-dev

      - name: Build the Projucer (JUCE's Android project generator)
        run: |
          cmake -S external/JUCE -B build-projucer -G Ninja -DCMAKE_BUILD_TYPE=Release -DJUCE_BUILD_EXTRAS=ON
          cmake --build build-projucer --target Projucer

      - name: Generate the Android Studio project from android/BitBuddy.jucer
        run: xvfb-run -a "$(find build-projucer -type f -name Projucer -perm -u+x | head -1)" --resave android/BitBuddy.jucer

      # Java 21 runs Gradle; the generated project also compiles against a Java 8 toolchain.
      # Installing 8 here means Gradle never downloads it mid-build (that download can arrive corrupt).
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            8
            21
          cache: gradle   # keep downloaded build parts between runs (fewer downloads, fewer 429s)

      - name: Android NDK + signing key
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.1.13356709" > /dev/null
          mkdir -p ~/.android
          keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=BitBuddy,O=BitBuddy Labs,C=US"

      - name: Build the APK
        working-directory: android/Builds/Android
        run: |
          chmod +x gradlew
          # Maven Central sometimes rate-limits GitHub's shared machines (HTTP 429): retry
          for attempt in 1 2 3; do
            ./gradlew assembleRelease_Release --no-daemon --quiet && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            echo "Gradle failed (attempt $attempt), usually a temporary download limit - retrying in 60 s"
            sleep 60
          done
          version="$(sed -n 's/^project(BitBuddy VERSION \([0-9.]*\).*/\1/p' "$GITHUB_WORKSPACE/CMakeLists.txt")"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$(find app/build/outputs/apk -name '*.apk' | head -1)" "$GITHUB_WORKSPACE/dist/BitBuddy-$version-Android.apk"

      - name: Enable hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test on an Android 14 emulator (install, launch, screenshot)
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash scripts/android-smoke-test.sh dist/BitBuddy-*-Android.apk

      - uses: actions/upload-artifact@v7
        with:
          name: BitBuddy-Android
          path: dist/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshot-android
          path: dist/android-screenshot.png
          if-no-files-found: ignore

  ios:
    name: iOS (AUv3 + app, iPad simulator)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure (Xcode project for iPhone / iPad)
        run: >
          cmake -B build-ios -G Xcode -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphonesimulator
          -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO

      - name: Build the app + AUv3 for the simulator
        run: cmake --build build-ios --config Release --target BitBuddy_Standalone -- -quiet

      - name: Smoke test on an iPad simulator (install, launch, screenshot)
        run: bash scripts/ios-smoke-test.sh

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshot-ios
          path: dist/ios-screenshot.png
          if-no-files-found: ignore

  release:
    name: Publish the Release page
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, android, ios]   # publish only when every platform is green
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" artifacts/*.zip artifacts/*.apk
          --title "BitBuddy ${GITHUB_REF_NAME#v}"
          --notes-file .github/RELEASE_NOTES.md
